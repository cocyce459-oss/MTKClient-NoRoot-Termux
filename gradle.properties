org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# --- MTK asset vendoring -------------------------------------------------
# The MediaTek Download Agent binaries are large (~48 MB) and are NOT kept in
# git. They are fetched at build time and bundled into the APK so the finished
# app works fully offline.
#
#   -PmtkclientDir=/path/to/mtkclient   use a local checkout instead of downloading
#   -PslimAssets=true                   omit Loader/ DA binaries (BROM-only build, ~2 MB APK)
#   -PmtkclientRef=main                 git ref / tarball branch to vendor from
